<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Talk</title>
    <link href="/styles/styles.css" rel="stylesheet">
    <link href="/styles/icons-lib.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1zSGpTrBOGJfrFiZPIKI-dHhLj--NYjj3=w32">
</head>

<body>
    <header>
        <div class="header-section">
        </div>
        <div class="header-section">
            <span class="logo icon-logo" role="img" aria-label="logo"></span>
        </div>
        <div class="header-section">
        </div>
        <div id="settings-widget" title="Theme Settings">
            <span class="icon-gear" role="img" aria-label="settings"></span>
        </div>
        <div id="theme-menu">
            <div class="theme-option" data-theme="light">
                <div class="theme-option-symbol">
                    <span class="icon-sun" role="img" aria-label="light"></span>
                </div>
                <div>Light</div>
            </div>
            <div class="theme-option" data-theme="dark">
                <div class="theme-option-symbol">
                    <span class="icon-moon" role="img" aria-label="dark"></span>
                </div>
                <div>Dark</div>
            </div>
            <div class="theme-option" data-theme="system">
                <div class="theme-option-symbol">
                    <span class="icon-gear" role="img" aria-label="system"></span>
                </div>
                <div>System</div>
            </div>
        </div>
    </header>
    <div class="container">
        <ul class="topics-list" id="topicsList"></ul>
    </div>
    <footer class="f">
        <div class="footer-section left f">
            <a href="https://github.com/yisroelshulman" target="_blank" class="icon">
                <span class="icon-git icon-foot" role="img" aria-label="github"></span>
            </a>
        </div>
        <div class="footer-section center">
            <div class="footer-text">
                <a href="mailto:smalltalk@yisroelshulman.com">smalltalk@yisroelshulman.com</a>
                <br>
                <p>&copy; 2025 by Yisroel Shulman.</p>
            </div>
        </div>
        <div class="footer-section right">
            <a href="https://www.linkedin.com/in/yisroelshulman" target="_blank" class="icon">
                <span class="icon-linkedin icon-foot" role="img" aria-label="linkedin"></span>
            </a>
        </div>
    </footer>
    <script src="/js/theme.js"></script>
    <script src="/js/lists.js"></script>
    <script src="/js/topics.js"></script>
</body>

</html>
